app-id: com.overwolf.curseforge
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: curseforge
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-documents/curseforge:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

modules:
  - name: curseforge
    buildsystem: simple
    build-commands:
      - install -Dm755 curseforge.sh "${FLATPAK_DEST}/bin/curseforge"
      - cp -a share/. "${FLATPAK_DEST}/share/"
      - rm -rf share curseforge.sh
      - mkdir -p "${FLATPAK_DEST}/curseforge"
      - cp -a . "${FLATPAK_DEST}/curseforge/"
    sources:
      - type: archive
        url: 
          https://curseforge.overwolf.com/electron/linux/versions/1.326.0.42377/CurseForge-1.326.0-42377.tar.gz
        sha512: 
          342f44535a3ac213c14ed5631e753d0fdf192fae4da83f65028f5863227211a07b2f66f58601c3b08a19105499cd072b0b9c86dd8e387060d57602dc476116c7
        strip-components: 1
        only-arches: [x86_64]
        x-checker-data:
          type: json
          is-main-source: true
          url: https://curseforge.overwolf.com/electron/linux/flathub-latest.json
          version-query: .version
          url-query: .url
      - type: file
        path: curseforge.sh
