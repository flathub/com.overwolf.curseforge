app-id: com.overwolf.curseforge
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: curseforge
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-documents/curseforge:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

modules:
  - name: curseforge
    buildsystem: simple
    build-commands:
      - install -Dm755 curseforge.sh "${FLATPAK_DEST}/bin/curseforge"
      - cp -a share/. "${FLATPAK_DEST}/share/"
      - rm -rf share curseforge.sh
      - mkdir -p "${FLATPAK_DEST}/curseforge"
      - cp -a . "${FLATPAK_DEST}/curseforge/"
    sources:
      - type: archive
        url: https://curseforge.overwolf.com/electron/linux/versions/1.323.0.40840/CurseForge-1.323.0-40840.tar.gz
        sha512: f3a484782afb28c1fce9436d64b8c3159b95c78ffa3f40058712560446b077d6f931be7099bd41dadd47b6b2a4f6cea2d2cc4a44c5d10de35f7a8b00e3165814
        strip-components: 1
        only-arches: [x86_64]
        x-checker-data:
          type: json
          is-main-source: true
          url: https://curseforge.overwolf.com/electron/linux/flathub-latest.json
          version-query: .version
          url-query: .url
      - type: file
        path: curseforge.sh
