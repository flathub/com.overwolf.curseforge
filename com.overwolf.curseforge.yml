app-id: com.overwolf.curseforge
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: curseforge
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-documents/curseforge:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

modules:
  - name: curseforge
    buildsystem: simple
    build-commands:
      - install -Dm755 curseforge.sh "${FLATPAK_DEST}/bin/curseforge"
      - cp -a share/. "${FLATPAK_DEST}/share/"
      - rm -rf share curseforge.sh
      - mkdir -p "${FLATPAK_DEST}/curseforge"
      - cp -a . "${FLATPAK_DEST}/curseforge/"
    sources:
      - type: archive
        url: 
          https://curseforge.overwolf.com/electron/linux/versions/1.325.0.41594/CurseForge-1.325.0-41594.tar.gz
        sha512: 
          6b197f45c3350cdca68cddf250d5c1c4fe84cb06717fb0aa51ccd911ef25be52e58ef07ddb1b8875f9bf180d515fff564f92a76f5bc67922bb3085b9608394f2
        strip-components: 1
        only-arches: [x86_64]
        x-checker-data:
          type: json
          is-main-source: true
          url: https://curseforge.overwolf.com/electron/linux/flathub-latest.json
          version-query: .version
          url-query: .url
      - type: file
        path: curseforge.sh
