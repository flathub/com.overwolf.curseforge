app-id: com.overwolf.curseforge
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: curseforge
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-documents/curseforge:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

modules:
  - name: curseforge
    buildsystem: simple
    build-commands:
      - install -Dm755 curseforge.sh "${FLATPAK_DEST}/bin/curseforge"
      - cp -a share/. "${FLATPAK_DEST}/share/"
      - rm -rf share curseforge.sh
      - mkdir -p "${FLATPAK_DEST}/curseforge"
      - cp -a . "${FLATPAK_DEST}/curseforge/"
    sources:
      - type: archive
        url: 
          https://curseforge.overwolf.com/electron/linux/versions/1.328.0.43478/CurseForge-1.328.0-43478.tar.gz
        sha512: 
          1c7989ca21bdbf2dbbaa8dee56fb63928193636826e5320b51b94075c2e2aca5abdeeffe813f6fc4c0d61f275dde01c476241413daacce4fb1f35c4801ac3ca3
        strip-components: 1
        only-arches: [x86_64]
        x-checker-data:
          type: json
          is-main-source: true
          url: https://curseforge.overwolf.com/electron/linux/flathub-latest.json
          version-query: .version
          url-query: .url
      - type: file
        path: curseforge.sh
